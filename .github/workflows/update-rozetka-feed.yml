name: Publish Aqua-Favorit Rozetka XML

on:
  schedule:
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the sheet marker is unchanged
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: aquafavorit-rozetka-r2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_XML_URL: https://aqua-favorit.com.ua/marketplace-integration/rozetka-feed/
      CONTROL_CSV_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vRLBoQ63DdiKn16Yanq1IsJfV9DWvMHczn9OrAt2oZK352JRBvbZS6eW-_pp_G1DMDB64UGp4Z8KZl3/pub?gid=1710262027&single=true&output=csv
      PUBLIC_R2_BASE: https://feeds.aqua-favorit.com.ua
      R2_OBJECT_KEY: aquafavorit_rozetka.xml
      R2_STATE_KEY: aquafavorit_rozetka.state.json
      R2_HEALTH_KEY: aquafavorit_rozetka.health.json

    steps:
      - uses: actions/checkout@v5
        id: checkout
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.12'

      - name: Read control sheet and prior publication state
        id: controls
        run: |
          curl --fail --location --silent --show-error --retry 4 --retry-delay 10 \
            --max-time 180 "$CONTROL_CSV_URL" --output controls.csv
          test "$(wc -c < controls.csv)" -ge 1000000
          state_code=$(curl --location --silent --show-error --max-time 30 \
            --output previous_state.json --write-out '%{http_code}' \
            "$PUBLIC_R2_BASE/$R2_STATE_KEY")
          if [ "$state_code" = 404 ]; then
            printf '{}\n' > previous_state.json
          elif [ "$state_code" != 200 ]; then
            echo "Cannot read R2 state: HTTP $state_code"
            exit 1
          fi

      - name: Decide whether the feed must be rebuilt
        id: decision
        env:
          ROZETKA_FORCE_REFRESH: ${{ inputs.force }}
        run: |
          python needs_refresh.py --controls-csv controls.csv \
            --state-json previous_state.json --decision-json decision.json \
            --max-age-hours 24

      - name: Download full source feed
        id: download
        if: steps.decision.outputs.run == 'true'
        run: |
          curl --fail --location --silent --show-error --retry 4 --retry-delay 20 \
            --max-time 1200 "$SOURCE_XML_URL" --output source.xml
          test "$(wc -c < source.xml)" -ge 180000000

      - name: Render and validate complete XML
        id: render
        if: steps.decision.outputs.run == 'true'
        run: |
          python render_feed.py --source source.xml --controls-csv controls.csv \
            --output aquafavorit_rozetka.xml > render_stats.json
          python -c 'import json; s=json.load(open("render_stats.json")); assert s["offers"] >= 40000 and s["controlled_offers"] >= 30000, s'
          test "$(wc -c < aquafavorit_rozetka.xml)" -ge 180000000

      - name: Compare product content with published XML
        id: compare
        if: steps.decision.outputs.run == 'true'
        run: |
          python compare_feed.py --rendered aquafavorit_rozetka.xml \
            --previous-state previous_state.json \
            --public-url "$PUBLIC_R2_BASE/$R2_OBJECT_KEY" \
            --output comparison.json

      - name: Install R2 client
        id: install_r2
        if: steps.decision.outputs.run == 'true'
        run: python -m pip install awscli

      - name: Publish changed XML or record unchanged content
        id: publish_r2
        if: steps.decision.outputs.run == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY CF_R2_ACCOUNT_ID CF_R2_BUCKET_NAME; do
            if [ -z "${!key}" ]; then
              echo "Missing GitHub Actions secret: $key"
              exit 1
            fi
          done
          endpoint="https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          changed=$(python -c 'import json; print(str(json.load(open("comparison.json"))["changed"]).lower())')
          if [ "$changed" = true ]; then
            aws s3 cp aquafavorit_rozetka.xml "s3://${CF_R2_BUCKET_NAME}/${R2_OBJECT_KEY}" \
              --endpoint-url "$endpoint" --no-progress \
              --content-type 'application/xml; charset=utf-8' \
              --cache-control 'no-store, max-age=0'
          fi
          remote_size=$(aws s3api head-object --bucket "$CF_R2_BUCKET_NAME" \
            --key "$R2_OBJECT_KEY" --endpoint-url "$endpoint" \
            --query ContentLength --output text)
          if [ "$changed" = true ]; then
            local_size=$(wc -c < aquafavorit_rozetka.xml)
            test "$remote_size" -eq "$local_size"
          else
            previous_size=$(python -c 'import json; print(json.load(open("previous_state.json"))["bytes"])')
            test "$remote_size" -eq "$previous_size"
          fi
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          decision = json.load(open('decision.json', encoding='utf-8'))
          stats = json.load(open('render_stats.json', encoding='utf-8'))
          comparison = json.load(open('comparison.json', encoding='utf-8'))
          previous = json.load(open('previous_state.json', encoding='utf-8'))
          now = datetime.now(timezone.utc).isoformat()
          state = dict(previous)
          if comparison['changed']:
              state.update(generated_at=now, offers=stats['offers'],
                           controlled_offers=stats['controlled_offers'], bytes=stats['bytes'])
          state.update(refresh_token=decision['refresh_token'],
                       last_checked_at=now,
                       last_check_result='published' if comparison['changed'] else 'unchanged',
                       semantic_sha256=comparison['semantic_sha256'])
          with open('publication_state.json', 'w', encoding='utf-8') as stream:
              json.dump(state, stream, ensure_ascii=False)
          PY
          aws s3 cp publication_state.json "s3://${CF_R2_BUCKET_NAME}/${R2_STATE_KEY}" \
            --endpoint-url "$endpoint" --no-progress \
            --content-type 'application/json; charset=utf-8' \
            --cache-control 'no-store, max-age=0'
          echo "Content changed: $changed; XML size: $remote_size bytes"

      - name: Report result for the control sheet
        if: always() && (steps.decision.outputs.run == 'true' || failure())
        env:
          JOB_RESULT: ${{ job.status }}
          STEP_CHECKOUT: ${{ steps.checkout.outcome }}
          STEP_PYTHON: ${{ steps.python.outcome }}
          STEP_CONTROLS: ${{ steps.controls.outcome }}
          STEP_DECISION: ${{ steps.decision.outcome }}
          STEP_DOWNLOAD: ${{ steps.download.outcome }}
          STEP_RENDER: ${{ steps.render.outcome }}
          STEP_COMPARE: ${{ steps.compare.outcome }}
          STEP_INSTALL_R2: ${{ steps.install_r2.outcome }}
          STEP_PUBLISH_R2: ${{ steps.publish_r2.outcome }}
          CONTENT_CHANGED: ${{ steps.compare.outputs.changed }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          python -m pip install --quiet awscli
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          stages = [
              ('checkout', 'Получение кода'),
              ('python', 'Подготовка Python'),
              ('controls', 'Чтение таблицы и состояния фида'),
              ('decision', 'Решение об обновлении'),
              ('download', 'Загрузка исходного XML'),
              ('render', 'Расчёт и проверка итогового XML'),
              ('compare', 'Сравнение содержимого XML'),
              ('install_r2', 'Подготовка клиента R2'),
              ('publish_r2', 'Публикация XML или запись результата сверки в R2'),
          ]
          failed = next(((key, title) for key, title in stages
                         if os.getenv('STEP_' + key.upper()) == 'failure'), None)
          result = ('success' if os.environ.get('CONTENT_CHANGED') == 'true' else 'unchanged') \
              if os.environ['JOB_RESULT'] == 'success' else 'failure'
          stage = failed[1] if failed else ('Неизвестный этап' if result == 'failure' else '')
          descriptions = {
              'controls': 'Не удалось прочитать таблицу или текущее состояние R2.',
              'decision': 'Не удалось сравнить запрос с опубликованным фидом.',
              'download': 'Не удалось скачать исходный XML сайта либо его размер меньше 180 МБ.',
              'render': 'Ошибка расчёта, проверки XML или количества товаров.',
              'compare': 'Не удалось сравнить готовый XML с опубликованным.',
              'install_r2': 'Не удалось подготовить клиент R2.',
              'publish_r2': 'Не удалось записать или проверить XML и состояние в R2.',
          }
          report = {
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'result': result,
              'stage': stage,
              'message': descriptions.get(failed[0], 'Откройте журнал запуска для деталей.')
                         if failed else ('XML проверен: содержимое не изменилось.' if result == 'unchanged' else ''),
              'run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          with open('publication_health.json', 'w', encoding='utf-8') as stream:
              json.dump(report, stream, ensure_ascii=False)
          PY
          endpoint="https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp publication_health.json "s3://${CF_R2_BUCKET_NAME}/${R2_HEALTH_KEY}" \
            --endpoint-url "$endpoint" --no-progress \
            --content-type 'application/json; charset=utf-8' \
            --cache-control 'no-store, max-age=0'
